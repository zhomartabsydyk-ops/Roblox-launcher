name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project and add our files
        run: |
          flutter create --project-name rbx_launcher --org com.example app
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart
          cp roblox_api.dart app/lib/roblox_api.dart
          python3 - <<'EOF'
          p = "app/android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          q = '''<queries>
              <intent>
                <action android:name="android.intent.action.VIEW" />
                <data android:scheme="roblox" />
              </intent>
            </queries>
            <application'''
          s = s.replace("<application", q, 1)
          open(p, "w", encoding="utf-8").write(s)
          EOF

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: rbx-launcher-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
